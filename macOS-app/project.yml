name: OfficeAttendance
options:
  bundleIdPrefix: com.ibm
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.ibm.office-attendance
    MARKETING_VERSION: "1.4.4"
    CURRENT_PROJECT_VERSION: "16"

targets:
  OfficeAttendance:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: OfficeAttendance
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibm.office-attendance
        INFOPLIST_FILE: OfficeAttendance/Info.plist
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: OfficeAttendance/OfficeAttendance.entitlements
    dependencies:
      - package: Sparkle
        product: Sparkle
    info:
      path: OfficeAttendance/Info.plist
      properties:
        CFBundleName: OfficeAttendance
        CFBundleDisplayName: Office Attendance
        CFBundleIdentifier: com.ibm.office-attendance
        CFBundleVersion: "16"
        CFBundleShortVersionString: "1.4.4"
        LSUIElement: true
        NSUserNotificationAlertStyle: alert
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        SUFeedURL: https://github.com/cpan-NS1/office-attendance-wifi/releases/latest/download/appcast.xml
        SUPublicEDKey: M6oNnpuRZmpXgfvmRly6CmtwzLX81FqD3PbjFHaH2oM=

  OfficeAttendanceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: OfficeAttendanceTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibm.office-attendance-tests
    dependencies:
      - target: OfficeAttendance
